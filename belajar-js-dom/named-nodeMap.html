<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>named nodeMap</title>
</head>

<body>
    <img id="logo" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixid=MXwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHw%3D&ixlib=rb-1.2.1&auto=format&fit=crop&w=1050&q=80" alt="logo">
<script>

const logo = document.getElementById("logo");
const attributes = logo.attributes;


for (let attribute of attributes) {
    console.log(`${attribute.name} : ${attribute.value}`);
}
</script>

</body>
</html>
